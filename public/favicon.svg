<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle with Rose-to-Amber Gradient -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)"/>
  
  <!-- Inner border highlight -->
  <rect x="25" y="25" width="462" height="462" rx="103" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Vinyl Record Disc (Disc3 look) -->
  <g transform="translate(256, 256)">
    <!-- Vinyl base plate -->
    <circle r="164" fill="url(#discGrad)" stroke="#ffffff" stroke-width="14"/>
    
    <!-- Sound grooves -->
    <circle r="134" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.4"/>
    <circle r="106" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.45"/>
    <circle r="78" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.4"/>

    <!-- Stylized sound needle groove arc -->
    <path d="M -68 0 A 68 68 0 0 1 0 -68" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>

    <!-- Center Record Label -->
    <circle r="48" fill="#f43f5e" stroke="#ffffff" stroke-width="8"/>

    <!-- Center Spindle Hole -->
    <circle r="18" fill="#0c0c10"/>
    <circle r="18" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.8"/>
  </g>
</svg>
